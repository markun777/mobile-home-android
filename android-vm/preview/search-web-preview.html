<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=412">
<title>全网搜索输入态 — 571:44493</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    display: flex; justify-content: center; align-items: flex-start;
    min-height: 100vh; padding: 40px 0;
    background: #E0E0E0;
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  }
  .phone {
    width: 412px; height: 914px;
    background: #F0F1F4;
    border-radius: 40px; overflow: hidden; position: relative;
    box-shadow: 0 0 0 2px #333, 0 20px 60px rgba(0,0,0,0.3);
    flex-shrink: 0;
  }

  .status-bar {
    height: 36px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 24px;
    font-size: 14px; font-weight: 500; color: rgba(0,0,0,0.88);
    position: relative; z-index: 10;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; }

  .header {
    height: 48px; display: flex; align-items: center; padding: 4px 8px;
  }
  .back-btn {
    width: 40px; height: 40px; display: flex;
    align-items: center; justify-content: center; cursor: pointer;
    border: none; background: none;
  }

  /* Search box */
  .search-box-wrap {
    position: absolute; top: 385px; left: 16px; width: 380px;
  }
  .search-box {
    background: #fff; border: 0.5px solid #1F62EE; border-radius: 16px; padding: 12px;
  }
  .search-input-row {
    display: flex; align-items: flex-start; gap: 2px;
    min-height: 21px; margin-bottom: 24px;
  }
  .cursor { width: 2px; height: 21px; flex-shrink: 0; }
  .placeholder-text { font-size: 14px; color: rgba(0,0,0,0.28); line-height: 21px; }

  .search-toolbar { display: flex; align-items: center; justify-content: space-between; }

  /* Engine selector button */
  .engine-selector {
    display: flex; align-items: center; gap: 4px;
    height: 28px; padding: 4px;
    border: 0.5px solid rgba(0,0,0,0.08);
    border-radius: 8px;
    cursor: pointer; background: none;
  }
  .engine-selector img { width: 20px; height: 20px; object-fit: contain; }
  .engine-selector .arrow { width: 16px; height: 16px; }

  .action-icons { display: flex; gap: 16px; align-items: center; }
  .icon-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; }
  .icon-btn img { width: 24px; height: 24px; object-fit: contain; }

  /* Content */
  .content-area { position: absolute; top: 149px; left: 16px; width: 380px; }

  .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .section-title-group { display: flex; align-items: center; gap: 12px; }
  .section-title { font-size: 14px; color: rgba(0,0,0,0.45); }
  .section-icon { width: 18px; height: 18px; object-fit: contain; opacity: 0.6; }
  .hot-link { display: flex; align-items: center; gap: 2px; font-size: 12px; color: rgba(0,0,0,0.88); cursor: pointer; background: none; border: none; }
  .hot-link img { width: 18px; height: 18px; object-fit: contain; }

  .suggest-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 24px; }
  .suggest-chip {
    background: #fff; border-radius: 6px;
    display: flex; align-items: center; gap: 4px;
    height: 32px; padding: 8px;
    font-size: 12px; color: rgba(0,0,0,0.88);
    overflow: hidden; white-space: nowrap; cursor: pointer; border: none;
  }
  .suggest-chip img { width: 16px; height: 16px; object-fit: contain; flex-shrink: 0; }

  .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .history-delete { width: 18px; height: 18px; cursor: pointer; background: none; border: none; }
  .history-delete img { width: 18px; height: 18px; object-fit: contain; }

  .history-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .history-chip {
    background: #fff; border-radius: 6px;
    padding: 10px 12px; font-size: 12px; color: rgba(0,0,0,0.88);
    white-space: nowrap; cursor: pointer; border: none;
  }
  .history-chip.url {
    display: flex; align-items: center; gap: 6px;
    height: 32px; padding: 7px 18px 9px 8px;
  }
  .history-chip.url img { width: 16px; height: 16px; object-fit: contain; }

  .url-bar {
    position: absolute; top: 498px; left: 0; width: 412px;
    background: #fff; height: 48px;
    display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
  }
  .url-shortcuts { display: flex; gap: 16px; align-items: center; font-size: 12px; color: rgba(0,0,0,0.88); }
  .url-sep { width: 1px; height: 12px; background: rgba(0,0,0,0.15); }
  .url-nav-btns { display: flex; gap: 8px; align-items: center; }

  .keyboard {
    position: absolute; bottom: 0; left: 0; width: 412px; height: 368px; overflow: hidden;
  }
  .keyboard img { width: 100%; height: 100%; object-fit: cover; }

  /* Overlay + bottom sheet — hidden by default */
  .overlay {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.4);
    display: none;
    flex-direction: column; justify-content: flex-end;
    z-index: 20;
  }
  .overlay.active { display: flex; }

  .sheet {
    background: #fff;
    border-radius: 16px 16px 0 0;
    overflow: hidden;
    padding: 0 12px 12px;
  }
  .sheet-header {
    height: 56px; display: flex; align-items: center; justify-content: space-between;
    padding: 0 12px; font-size: 18px; font-weight: 600; color: rgba(0,0,0,0.88);
  }
  .sheet-close { width: 16px; height: 16px; cursor: pointer; background: none; border: none; }
  .sheet-close img { width: 16px; height: 16px; object-fit: contain; }

  .engine-row {
    display: flex; align-items: center; justify-content: space-between;
    height: 56px; padding: 12px 12px 12px 4px;
    border-radius: 99px; cursor: pointer; border: none; background: none; width: 100%;
  }
  .engine-left { display: flex; align-items: center; gap: 8px; }
  .engine-logo { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; }
  .engine-name { font-size: 14px; color: rgba(0,0,0,0.88); }
  .engine-check { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }

  .system-bar-btm {
    height: 20px; display: flex; align-items: center; justify-content: center;
  }
  .nav-handle {
    width: 94px; height: 3.5px; background: rgba(0,0,0,0.45); border-radius: 10px; opacity: 0.6;
  }
</style>
</head>
<body>
<div class="phone">

  <div class="status-bar">
    <span>9:30</span>
    <div class="status-icons">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M5 12.55a11 11 0 0 1 14.08 0M1.42 9a16 16 0 0 1 21.16 0M8.53 16.11a6 6 0 0 1 6.95 0M12 20h.01" stroke="rgba(0,0,0,0.88)" stroke-width="2" stroke-linecap="round"/></svg>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="rgba(0,0,0,0.88)"><rect x="2" y="16" width="3" height="6" rx="1"/><rect x="7" y="12" width="3" height="10" rx="1"/><rect x="12" y="8" width="3" height="14" rx="1"/><rect x="17" y="4" width="3" height="18" rx="1"/></svg>
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><rect x="2" y="7" width="18" height="11" rx="2" stroke="rgba(0,0,0,0.88)" stroke-width="1.5"/><path d="M20 10v5" stroke="rgba(0,0,0,0.88)" stroke-width="2" stroke-linecap="round"/><rect x="4" y="9" width="12" height="7" rx="1" fill="rgba(0,0,0,0.88)"/></svg>
    </div>
  </div>

  <div class="header">
    <button class="back-btn" onclick="history.back()">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="rgba(0,0,0,0.88)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <div class="content-area">
    <div class="section-header">
      <div class="section-title-group">
        <span class="section-title">搜索推荐</span>
        <img class="section-icon" src="preview-assets/icon_eye.png" alt="">
        <img class="section-icon" src="preview-assets/icon_refresh.png" alt="">
      </div>
      <button class="hot-link">
        <span>热搜榜</span>
        <img src="preview-assets/icon_hot_arrow.png" alt="">
      </button>
    </div>
    <div class="suggest-grid">
      <button class="suggest-chip"><img src="preview-assets/icon_topic1.png" alt="">四川推进川菜地方立法</button>
      <button class="suggest-chip"><img src="preview-assets/icon_topic2.png" alt="">假期推荐的10个好地...</button>
      <button class="suggest-chip"><img src="preview-assets/icon_topic3.png" alt="">张颂文新剧《猎冰》...</button>
      <button class="suggest-chip"><img src="preview-assets/icon_topic1.png" alt="">有关部门调查秦朗丢...</button>
    </div>

    <div class="history-header">
      <span class="section-title" style="font-size:14px">输入历史</span>
      <button class="history-delete"><img src="preview-assets/icon_delete_history.png" alt=""></button>
    </div>
    <div class="history-chips">
      <button class="history-chip">成都</button>
      <button class="history-chip url">
        <img src="preview-assets/icon_url.png" alt="">
        www.qq.com
      </button>
      <button class="history-chip">成都今天下雪了吗...</button>
      <button class="history-chip">杭</button>
      <button class="history-chip">谷爱凌</button>
      <button class="history-chip">成都天气预报</button>
    </div>
  </div>

  <!-- Search box -->
  <div class="search-box-wrap">
    <div class="search-box">
      <div class="search-input-row">
        <div class="cursor"><img src="preview-assets/cursor_bar.png" alt="" style="width:2px;height:21px"></div>
        <span class="placeholder-text">请输入文本发起搜索</span>
      </div>
      <div class="search-toolbar">
        <button class="engine-selector" onclick="toggleSheet()">
          <img src="preview-assets/baidu_icon.png" alt="百度">
          <img class="arrow" src="preview-assets/icon_dropdown.png" alt="">
        </button>
        <div class="action-icons">
          <button class="icon-btn"><img src="preview-assets/search_camera.png" alt=""></button>
          <button class="icon-btn"><img src="preview-assets/search_microphone.png" alt=""></button>
        </div>
      </div>
    </div>
  </div>

  <div class="url-bar">
    <div class="url-shortcuts"><span>www.</span><div class="url-sep"></div><span>/</span><div class="url-sep"></div><span>.</span><div class="url-sep"></div><span>.com</span><div class="url-sep"></div><span>.cn</span></div>
    <div class="url-nav-btns">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M19 12H5M12 5l-7 7 7 7" stroke="rgba(0,0,0,0.45)" stroke-width="1.5" stroke-linecap="round"/></svg>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M12 19l7-7-7-7" stroke="rgba(0,0,0,0.45)" stroke-width="1.5" stroke-linecap="round"/></svg>
    </div>
  </div>

  <div class="keyboard"><img src="preview-assets/keyboard_bg.png" alt=""></div>

  <!-- Engine picker overlay — hidden by default -->
  <div class="overlay" id="engineOverlay">
    <div class="sheet">
      <div class="sheet-header">
        <span>选择搜索引擎</span>
        <button class="sheet-close" onclick="toggleSheet()"><img src="preview-assets/icon_close.png" alt=""></button>
      </div>
      <!-- 百度 selected -->
      <button class="engine-row" onclick="toggleSheet()"><div class="engine-left"><div class="engine-logo"><img src="preview-assets/baidu_icon.png" alt="" style="width:28px;height:28px;object-fit:contain"></div><span class="engine-name">百度</span></div><div class="engine-check"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="#1F62EE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></button>
      <!-- Google -->
      <button class="engine-row" onclick="toggleSheet()"><div class="engine-left"><div class="engine-logo"><svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="none" stroke="#4285F4" stroke-width="3"/></svg></div><span class="engine-name">Google</span></div><div class="engine-check"></div></button>
      <!-- Bing -->
      <button class="engine-row" onclick="toggleSheet()"><div class="engine-left"><div class="engine-logo"><svg width="28" height="28" viewBox="0 0 28 28"><rect width="28" height="28" rx="4" fill="#008373"/><text x="7" y="20" font-size="13" fill="white" font-family="sans-serif">b</text></svg></div><span class="engine-name">Bing</span></div><div class="engine-check"></div></button>
      <!-- 360 -->
      <button class="engine-row" onclick="toggleSheet()"><div class="engine-left"><div class="engine-logo"><svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="#00C800"/><text x="6" y="19" font-size="11" fill="white" font-family="sans-serif">360</text></svg></div><span class="engine-name">360</span></div><div class="engine-check"></div></button>
      <!-- 搜狗 -->
      <button class="engine-row" onclick="toggleSheet()"><div class="engine-left"><div class="engine-logo"><svg width="28" height="28" viewBox="0 0 28 28"><circle cx="14" cy="14" r="12" fill="#E5392A"/><text x="5" y="19" font-size="10" fill="white" font-family="sans-serif">搜狗</text></svg></div><span class="engine-name">搜狗</span></div><div class="engine-check"></div></button>
      <!-- 今日头条 -->
      <button class="engine-row" onclick="toggleSheet()"><div class="engine-left"><div class="engine-logo"><svg width="28" height="28" viewBox="0 0 28 28"><rect width="28" height="28" rx="4" fill="#E8321A"/><text x="4" y="19" font-size="10" fill="white" font-family="sans-serif">头条</text></svg></div><span class="engine-name">今日头条</span></div><div class="engine-check"></div></button>
      <div class="system-bar-btm"><div class="nav-handle"></div></div>
    </div>
  </div>

</div>

<script>
function toggleSheet() {
  var ov = document.getElementById('engineOverlay');
  ov.classList.toggle('active');
}
</script>
</body>
</html>
