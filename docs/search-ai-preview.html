<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {

    background: #E0E0E0;

  .phone {

  .status-bar {

    font-size: 14px; font-weight: 500; color: rgba(0,0,0,0.88);
    position: relative; z-index: 10;
  }
  .status-icons { display: flex; gap: 6px; align-items: center; }

  /* Header with back button */
  .header {
    height: 48px; display: flex; align-items: center;
    padding: 4px 8px; gap: 4px;
  }
  .back-btn {
    width: 40px; height: 40px; display: flex;
    align-items: center; justify-content: center;
    cursor: pointer;
  }

  /* Search input box — active state with blue border */
  .search-box-wrap {
    position: absolute; top: 385px; left: 16px; width: 380px;
    padding: 8px;
  }
  .search-box {
    background: #fff;
    border: 1px solid #1F62EE;
    border-radius: 16px;
    padding: 12px;
  }
  .search-input-row {
    display: flex; align-items: flex-start; gap: 2px;
    min-height: 21px; margin-bottom: 24px;
  }
  .cursor { width: 2px; height: 21px; background: #1F62EE; flex-shrink: 0; }
  .search-placeholder-text {
    font-size: 14px; color: rgba(0,0,0,0.28); line-height: 21px;
  }
  .search-toolbar {
    display: flex; align-items: center; justify-content: space-between;
  }
  .mode-btns { display: flex; gap: 16px; align-items: center; }
  .mode-btn {
    display: flex; align-items: center; gap: 2px;
    height: 28px; padding: 4px 7px;
    border: 0.5px solid rgba(0,0,0,0.08);
    border-radius: 8px; font-size: 12px; color: rgba(0,0,0,0.45);
  }
  .mode-btn img { width: 14px; height: 14px; object-fit: contain; }
  .action-icons { display: flex; gap: 16px; align-items: center; }
  .icon-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; }
  .icon-btn img { width: 24px; height: 24px; object-fit: contain; }

  /* Content area (search suggestions + history) */
  .content-area {
    position: absolute; top: 149px; left: 16px; width: 380px;
  }

  /* 搜索推荐 section */
  .section-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .section-title-group { display: flex; align-items: center; gap: 12px; }
  .section-title { font-size: 14px; color: rgba(0,0,0,0.45); }
  .section-icon { width: 18px; height: 18px; opacity: 0.6; }
  .hot-link { display: flex; align-items: center; font-size: 12px; color: rgba(0,0,0,0.88); }
  .hot-link img { width: 18px; height: 18px; }

  .suggest-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
    margin-bottom: 24px;
  }
  .suggest-chip {
    background: #fff; border-radius: 6px;
    display: flex; align-items: center; gap: 4px;
    height: 32px; padding: 8px;
    font-size: 12px; color: rgba(0,0,0,0.88);
    overflow: hidden; white-space: nowrap;
  }
  .suggest-chip img { width: 16px; height: 16px; flex-shrink: 0; }

  /* 输入历史 section */
  .history-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 8px;
  }
  .history-chips {
    display: flex; flex-wrap: wrap; gap: 8px;
  }
  .history-chip {
    background: #fff; border-radius: 6px;
    padding: 10px 12px; font-size: 12px; color: rgba(0,0,0,0.88);
    white-space: nowrap;
  }
  .history-chip.url {
    display: flex; align-items: center; gap: 6px;
    height: 32px; padding: 7px 18px 9px 8px;
  }
  .history-chip.url img { width: 16px; height: 16px; }

  /* URL bar */
  .url-bar {
    position: absolute; top: 498px; left: 0; width: 412px;
    background: #fff; height: 48px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 16px;
  }
  .url-shortcuts { display: flex; gap: 16px; align-items: center; font-size: 12px; color: rgba(0,0,0,0.88); }
  .url-sep { width: 1px; height: 12px; background: rgba(0,0,0,0.15); }

  /* Keyboard */
  .keyboard {
    position: absolute; bottom: 0; left: 0; width: 412px; height: 368px;
    overflow: hidden;
  }
  .keyboard img { width: 100%; height: auto; position: absolute; bottom: 0; }
</style>
