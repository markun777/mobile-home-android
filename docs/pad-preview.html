<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>Pad Home — 91:5128 (Figma cut assets)</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  display:flex; justify-content:center; align-items:flex-start;
  min-height:100vh; background:#E0E0E0; padding:20px 0;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
.pad {
  width:1280px; background:#fff; border-radius:24px; overflow:hidden;
  box-shadow:0 0 0 2px #333,0 20px 60px rgba(0,0,0,0.3);
  flex-shrink:0; position:relative;
}

/* ── Browser Chrome ── */
.chrome { width:100%; }
.chrome img { width:100%; display:block; }

/* ── Hero: logo + search + shortcuts ── */
.hero {
  display:flex; flex-direction:column; align-items:center;
  padding:40px 0 0;
}
.hero-search { width:760px; margin-bottom:0; }
.hero-search img { width:100%; display:block; }
.shortcuts { width:760px; }
.shortcuts img { width:100%; display:block; }

/* ── Switch button ── */
.switch-btn {
  display:flex; justify-content:center; padding:20px 0 32px;
}
.switch-btn span {
  padding:8px 12px; border:0.5px solid rgba(0,0,0,0.1);
  border-radius:8px; font-size:12px; color:rgba(0,0,0,0.45); cursor:pointer;
}

/* ── Two-column grid ── */
.two-col {
  display:flex; gap:16px; justify-content:center;
  padding:0 240px 40px;
}
.two-col img { width:392px; display:block; border-radius:12px; }

.col { display:flex; flex-direction:column; gap:16px; }

/* Bottom nav handle */
.nav-handle-wrap {
  display:flex; justify-content:center; padding:12px 0;
}
.nav-handle {
  width:94px; height:4px; background:rgba(0,0,0,0.2); border-radius:2px;
}
</style>
</head>
<body>
<div class="pad">

  <!-- Browser chrome: tab bar + address bar + navigation -->
  <div class="chrome"><img src="preview-assets/pad_chrome.png" alt=""></div>

  <!-- Hero area -->
  <div class="hero">
    <!-- Logo + Search card -->
    <div class="hero-search"><img src="preview-assets/pad_hero.png" alt=""></div>
    <!-- Shortcuts row (7 icons) -->
    <div class="shortcuts"><img src="preview-assets/pad_shortcuts.png" alt=""></div>
  </div>

  <!-- Switch button -->
  <div class="switch-btn"><span>切换极简版</span></div>

  <!-- Two-column content grid -->
  <div class="two-col">
    <!-- LEFT COLUMN -->
    <div class="col">
      <!-- Utility cards + video -->
      <img src="preview-assets/pad_col1_util.png" alt="">
      <!-- News list -->
      <img src="preview-assets/pad_col1_news.png" alt="">
    </div>
    <!-- RIGHT COLUMN -->
    <div class="col">
      <!-- Utility cards -->
      <img src="preview-assets/pad_col2_top.png" alt="">
      <!-- Books section -->
      <img src="preview-assets/pad_col2_books.png" alt="">
      <!-- More utility -->
      <img src="preview-assets/pad_col2_util.png" alt="">
    </div>
  </div>

  <div class="nav-handle-wrap"><div class="nav-handle"></div></div>

</div>
</body>
</html>
